# UTF-8 MiniMessage. Keep <placeholders>; prefix affects chat only.
# owner-* labels describe who created the voucher; redemption restrictions are separate.
prefix: ''
error:
  permission: <#FF7F8A>You do not have permission to do that.</#FF7F8A>
  player-only: <#FF7F8A>This command requires an online player.</#FF7F8A>
  not-ready: <#F6D365>VIP storage is starting. Please try again shortly.</#F6D365>
  busy: <#F6D365>Too many VIP operations are pending. Please try again shortly.</#F6D365>
  internal: '<#FF7F8A>The operation could not be completed. Reference: <reference>.</#FF7F8A>'
  duration: <#FF7F8A>Invalid duration '<input>'. Use 30d, 12h, 30m, 45s or 7d12h30m; maximum <maximum> days.</#FF7F8A>
  vip: '<#FF7F8A>Unknown VIP type: <input>.</#FF7F8A>'
  player: '<#FF7F8A>Player not found or name is ambiguous: <input>. Use a UUID or a known unique name.</#FF7F8A>'
  no-vip: <#F6D365>No active VIP was found for <player>.</#F6D365>
  multiple: '<#F6D365>More than one VIP is active. Specify the VIP type: <types>.</#F6D365>'
  policy: <#FF7F8A>The configured VIP stacking policy rejects this operation.</#FF7F8A>
  amount: <#FF7F8A>Voucher amount must be between 1 and <maximum>.</#FF7F8A>
  excessive-removal: <#FF7F8A>The requested removal exceeds the remaining VIP duration.</#FF7F8A>
  freeze-range: <#FF7F8A>The remaining VIP time is outside the configured freeze limits.</#FF7F8A>
  cooldown: <#F6D365>You can freeze again in <remaining>.</#F6D365>
  world: <#FF7F8A>VIP freezing is disabled in this world.</#FF7F8A>
  inventory: <#F6D365>Make room in your inventory before creating a voucher.</#F6D365>
  vouchers-disabled: <#FF7F8A>Vouchers are disabled.</#FF7F8A>
  voucher-invalid: <#FF7F8A>This voucher is invalid or has been altered.</#FF7F8A>
  voucher-version: <#FF7F8A>This voucher format is not supported by this version of WellVipTime.</#FF7F8A>
  voucher-used: <#FF7F8A>This voucher was already redeemed or revoked.</#FF7F8A>
  voucher-owner: <#FF7F8A>This voucher belongs to another player.</#FF7F8A>
  reload: <#FF7F8A>Configuration validation failed. The previous configuration is still active; check the console.</#FF7F8A>
command:
  usage: <#F6D365><usage></#F6D365>
  viptime-usage: /<root> [player] | /<root> <give> <vip-id> <duration> <player> | /<root> <remove> <player> <vip-id> <duration> | /<root> <item> <vip-id>
    <duration> [amount] | /<root> <item> <item_give> <vip-id> <duration> <player> [amount] | /<root> <item> <item_giveall> <vip-id> <duration> [amount]
  freeze-usage: /<root> [player vip-id]
  admin-usage: /<root> <reload> | /<root> <recover> [voucher-uuid] | /<root> <revoke> [voucher-uuid]
